[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korserver"
version = "1.0.0"
description = "Korvus Server OpenConnect/ocserv VPN management platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Ivan Cherniy" }]
dependencies = [
  "fastapi>=0.111,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "ruff>=0.5,<1",
]

[project.urls]
Homepage = "https://r4ven.me"
Repository = "https://github.com/r4ven-me/korserver"

[project.scripts]
korctl = "korserver.cli:app"
korserver = "korserver.main:run"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
korserver = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true
